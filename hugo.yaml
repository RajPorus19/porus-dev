outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

pagination:
  pagerSize: 9

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  favicon: "/favicon.svg"
  useBootstrapCDN: false
  mathjax: false
  animate: true
  theme:
    defaultTheme: "light"
    disableThemeToggle: true

  hero:
    bottomImage:
      enable: false

  # 🎨 Indigo theme — high contrast, dev portfolio
  color:
    textColor: "#171717"
    secondaryTextColor: "#6b7280"
    textLinkColor: "#4f46e5"
    backgroundColor: "#fafafa"
    secondaryBackgroundColor: "#f3f4f6"
    primaryColor: "#4f46e5"
    secondaryColor: "#eef2ff"

    darkmode:
      textColor: "#f3f4f6"
      secondaryTextColor: "#9ca3af"
      textLinkColor: "#818cf8"
      backgroundColor: "#0f1117"
      secondaryBackgroundColor: "#1a1d24"
      primaryColor: "#818cf8"
      secondaryColor: "#1e1b4b"

  font:
    fontSize: 1rem
    fontWeight: 400
    lineHeight: 1.5
    textAlign: left

  navbar:
    align: ms-auto
    # the theme's inline search input is off; the command palette replaces it
    disableSearch: true
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: true
      disableExperience: true
      disableEducation: true
      disableProjects: true
      disableAchievements: true
      disableContact: true

  socialNetworks:
    github: https://github.com/RajPorus19
    linkedin: https://www.linkedin.com/in/raj-porus-hiruthayaraj-923818196

  listPages:
    disableFeaturedImage: false

  singlePages:
    socialShare: true
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  datesFormat:
    article: "2 Jan 2006"
    articleList: "2 Jan 2006"
    articleRecent: "2 Jan 2006"
